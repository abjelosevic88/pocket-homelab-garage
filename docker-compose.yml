# Pocket Garage — self-hosted vehicle log (Go + SQLite). One container, one volume.
services:
  pocket-garage:
    image: ghcr.io/abjelosevic88/pocket-homelab-garage:latest
    container_name: pocket-garage
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-EUR}
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Integrations can also be set in the UI under Settings → Integrations.
      FIREFLY_URL: ${FIREFLY_URL:-}
      FIREFLY_TOKEN: ${FIREFLY_TOKEN:-}
      DAWARICH_URL: ${DAWARICH_URL:-}
      DAWARICH_API_KEY: ${DAWARICH_API_KEY:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      # One-time import on first start when the database is still empty:
      LUBELOGGER_URL: ${LUBELOGGER_URL:-}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
