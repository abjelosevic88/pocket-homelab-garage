name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pocket-garage ./cmd/pocket-garage
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/pg DEMO_DATA=true AUTH_MODE=none FX_PROVIDER=none ./pocket-garage &
          sleep 2
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/v1/dashboard | grep -q vehicles
          curl -fsS http://localhost:8080/api/v1/vehicles/1/overview | grep -q '"reminders"'
          curl -fsS http://localhost:8080/api/v1/vehicles/1/export/calendar.ics | grep -q BEGIN:VCALENDAR
          curl -fsS http://localhost:8080/api/vehicles | grep -q licensePlate
          curl -fsS -X POST "http://localhost:8080/api/vehicle/gasrecords/add?vehicleId=1" -d "date=2030-01-01&odometer=999999&fuelConsumed=40,5&cost=70,25" | grep -q '"success":true'
          curl -fsS -X POST http://localhost:8080/api/v1/vehicles -H 'Content-Type: application/json' -d '{"make":"CI","model":"Car","year":2020}' | grep -q '"display_name":"2020 CI Car"'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pocket-garage:pr
